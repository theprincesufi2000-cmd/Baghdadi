name: Build Baghdadi Android

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Clean and validate Android resources
        shell: bash
        run: |
          chmod +x tools/clean-android-resources.sh
          ./tools/clean-android-resources.sh
          echo "--- Android resources ---"
          find app/src/main/res -type f -print | sort

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Baghdadi-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
