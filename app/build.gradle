plugins { id 'com.android.application' }

android { namespace 'com.baghdadi.chat'; compileSdk 35
    defaultConfig { applicationId 'com.baghdadi.chat'; minSdk 24; targetSdk 35; versionCode 1; versionName '1.0.0' }
    buildTypes { release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.16.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'io.github.webrtc-sdk:android:144.7559.09'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
